<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Viewfinder corner brackets -->
  <g stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Top-left -->
    <path d="M 120 180 L 120 130 A 10 10 0 0 1 130 120 L 180 120" />
    <!-- Top-right -->
    <path d="M 332 120 L 382 120 A 10 10 0 0 1 392 130 L 392 180" />
    <!-- Bottom-left -->
    <path d="M 120 332 L 120 382 A 10 10 0 0 0 130 392 L 180 392" />
    <!-- Bottom-right -->
    <path d="M 332 392 L 382 392 A 10 10 0 0 0 392 382 L 392 332" />
  </g>

  <!-- Laser scanning horizontal line -->
  <line x1="130" y1="256" x2="382" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <!-- Central OCR Text Glyph 'A' / Lens Scan symbol -->
  <g fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized Camera / Letter A -->
    <path d="M 210 320 L 256 195 L 302 320" />
    <line x1="225" y1="280" x2="287" y2="280" stroke="#38bdf8" stroke-width="16" />
  </g>

  <!-- Clipboard & Check Indicator -->
  <circle cx="370" cy="140" r="28" fill="#10b981" />
  <path d="M 358 140 L 366 148 L 384 132" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
